[project]
name = "llm-key-gate"
version = "0.1.0"
description = "key-gate: gateway POST /llm con acceso por clave, ritmo por cliente y registro de accesos — nace con auth-base (semana 25)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6,<7",
    "uvicorn>=0.30",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
key-gate = "key_gate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/key_gate"]

[dependency-groups]
dev = ["pytest>=8,<9"]
